<div class="cab">
  <div class="estado">
    @if (enchufado) {
      <span>Estado conexión eléctrica: ENCHUFADA ⚡</span>
    } @else {
      <span>Estado conexión eléctrica: DESENCHUFADO ❌</span>
    }
  </div>
  <div>
    <span>{{this.estadoLampara}}</span>
  </div>
  <div class="boton">
    @if (enchufado){
      <button (click)="onClickDesenchufar()">DESENCHUFAR</button>
    }
    @else{
      <button (click)="onClickEnchufar()">ENCHUFAR</button>
    }
  </div>
</div>
<app-lampara
[enchufada]="enchufado"
(estadoLampara)="onCambioEstadoLampara($event)"
></app-lampara>
